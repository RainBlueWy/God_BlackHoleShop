<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="เข้าสู่ระบบ - God_BlackHole">
    <title>เข้าสู่ระบบ - God_BlackHole</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css?v=1.5">
    <link rel="icon" type="image/png" href="favicon.png">


    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .auth-card {
            max-width: 450px;
            width: 100%;
            border-radius: var(--radius);
            padding: 2rem;
        }

        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .auth-header h1 {
            font-size: 2rem;
            margin-bottom: var(--spacing-sm);
        }

        .auth-header p {
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: var(--spacing-lg);
        }

        .form-group label {
            display: block;
            margin-bottom: var(--spacing-sm);
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all var(--transition-normal);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .alert {
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
            display: none;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .auth-footer {
            text-align: center;
            margin-top: var(--spacing-lg);
            padding-top: var(--spacing-lg);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .auth-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: var(--spacing-lg);
            transition: color var(--transition-fast);
        }

        .back-link:hover {
            color: var(--text-primary);
        }
    </style>
</head>

<body>
    <script>
        (function () { var v = null; function c() { var x = new XMLHttpRequest(); x.open('GET', 'version.php?r=' + Date.now(), true); x.setRequestHeader('Cache-Control', 'no-cache'); x.onload = function () { var t = (x.responseText || '').trim(); if (v !== null && t !== '' && t !== v) location.reload(); if (v === null) v = t; }; x.send(); } c(); setInterval(c, 10000); })();
    </script>
    <div class="noise"></div>
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.php" class="back-link">← กลับหน้าหลัก</a>

            <div class="auth-header">
                <h1>เข้าสู่ระบบ</h1>
                <p>ยินดีต้อนรับกลับมา!</p>
            </div>

            <div id="alert" class="alert"></div>

            <form id="loginForm" autocomplete="off">
                <input type="text" name="prevent_autofill" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;" tabindex="-1" autocomplete="off" aria-hidden="true">
                <input type="password" name="prevent_autofill_pw" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;" tabindex="-1" autocomplete="new-password" aria-hidden="true">
                <div class="form-group">
                    <label for="username">ชื่อผู้ใช้หรืออีเมล</label>
                    <input type="text" id="username" name="username" class="form-input"
                        placeholder="กรอกชื่อผู้ใช้หรืออีเมล" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">รหัสผ่าน</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="กรอกรหัสผ่าน"
                        autocomplete="off" required>
                </div> <br>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                    🔐 เข้าสู่ระบบ
                </button>
            </form>

            <div class="auth-footer">
                <p>ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></p>
            </div>
        </div>
    </div>

    <script>
        (function () { var t = localStorage.getItem('godblackhole-theme'); if (t === 'light') document.documentElement.setAttribute('data-theme', 'light'); else { if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; if (t === 'dark') document.documentElement.removeAttribute('data-theme'); } })();
    </script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = new FormData(this);
            const alert = document.getElementById('alert');
            const submitBtn = this.querySelector('button[type="submit"]');

            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ กำลังเข้าสู่ระบบ...';

            try {
                const response = await fetch('login_handler.php', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    alert.className = 'alert alert-success';
                    alert.style.display = 'block';
                    alert.textContent = result.message;

                    // Redirect to profile page after 1 second
                    setTimeout(() => {
                        window.location.href = result.redirect || 'profile.php';
                    }, 1000);
                } else {
                    alert.className = 'alert alert-error';
                    alert.style.display = 'block';
                    alert.textContent = result.message;

                    // Re-enable submit button
                    submitBtn.disabled = false;
                    submitBtn.textContent = '🔐 เข้าสู่ระบบ';
                }
            } catch (error) {
                alert.className = 'alert alert-error';
                alert.style.display = 'block';
                alert.textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';

                submitBtn.disabled = false;
                submitBtn.textContent = '🔐 เข้าสู่ระบบ';
            }
        });
    </script>
    <script src="script.js?v=2.0"></script>
</body>

</html>
